[build]
  command = "npm install && npm run build"
  publish = "."
  # Ensure builds trigger on content changes
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ':(exclude)README.md'"

[build.environment]
  NODE_VERSION = "20"

# Cache headers for dynamic content
[[headers]]
  for = "/js/blog-posts-data.js"
  [headers.values]
    cache-control = "max-age=0, no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    cache-control = "max-age=3600, must-revalidate"
    content-type = "application/xml"

# Redirect rules for dynamic SEO sitemap
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = false

[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/favicon.ico"
  to = "/assets/images/tunes-of-dunes.png"
  status = 301

[[redirects]]
  from = "/favicon.png"
  to = "/assets/images/tunes-of-dunes.png"
  status = 301


